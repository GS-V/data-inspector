# docker-compose.yml
# Run the app locally:  docker compose up --build
# Stop:                 docker compose down

services:
  data-inspector:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    # Host port 3000 → container port 80
    # Access the app at http://localhost:3000
    ports:
      - "3000:80"

    restart: unless-stopped
