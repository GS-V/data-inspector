server {
    listen 80;
    server_name _;

    # Where the built React app lives inside the container
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets (JS, CSS, images) with long-lived cache headers.
    # Vite content-hashes filenames (e.g. index-CSDmPtlX.js), so this is safe.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any route that doesn't match a real file
    # gets served index.html so React Router handles it.
    # Without this, refreshing on any sub-route returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compact error log — useful when debugging inside the container
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
